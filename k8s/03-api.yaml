apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: race-game
data:
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: race-game
  PORT: "3001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: race-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: angular-race-game-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: AUTH_SECRET
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: race-game
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
