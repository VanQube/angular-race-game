<div class="app-shell">
  <header class="hero">
    <div>
      <p class="eyebrow">Async race game</p>
      <h1>Neon Speedway</h1>
      <p class="hero-copy">
        Create your dream racers, pick bold colors, and watch them blast across the track in a dazzling finish.
      </p>
    </div>

    <div class="hero-badges">
      <div class="pill">Cars: {{ cars().length }}</div>
      <div class="pill">State: {{ raceInProgress() ? 'Racing' : raceFinished() ? 'Finished' : 'Ready' }}</div>
    </div>
  </header>

  <nav class="tab-nav" aria-label="Primary">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Race</a>
    <a routerLink="/garage" routerLinkActive="active">Garage</a>
    <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
  </nav>

  <main class="view-shell">
    <router-outlet></router-outlet>
  </main>
</div>
